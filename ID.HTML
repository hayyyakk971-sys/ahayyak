<style>
    /* ==================== FONT DEFINITIONS // تعريفات الخطوط ==================== */

      font-family: 'Afeesh';

           url('./afeesh/Afeesh-Aadi.ttf') format('truetype');

    }
    @font-face { /* Bold weight // وزن عريض */
      font-family: 'Afeesh';
      src: url('./afeesh/Afeesh-Mekalbaz.woff2') format('woff2'),
           url('./afeesh/Afeesh-Mekalbaz.woff') format('woff'),
           url('./afeesh/Afeesh-Mekalbaz.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face { /* Semi‑bold // شبه عريض */
      font-family: 'Afeesh';
      src: url('./afeesh/Afeesh-NosMekalbaz.woff2') format('woff2'),

    /* ==================== CSS VARIABLES (Light/Dark themes) // متغيرات CSS (السمات الفاتحة/الداكنة) ==================== */

    [data-theme="dark"] { /* Dark theme overrides // تجاوزات السمة الداكنة */

    /* ==================== GLOBAL BODY STYLES // أنماط الجسم العامة ==================== */
    body {

        display: flex; /* Flexbox layout // تخطيط مرن */
        flex-direction: column; /* Stack children vertically // تكديس العناصر عمودياً */
        min-height: 100vh; /* Full viewport height // ارتفاع كامل لمنفذ العرض */
        margin: 0; /* Remove default margin // إزالة الهوامش الافتراضية */
        font-family: 'Cairo', sans-serif; /* Default font // الخط الافتراضي */
        color: var(--ink); /* Text color from variable // لون النص من المتغير */
    }

    /* ==================== HEADER STYLES // أنماط الترويسة ==================== */
    header.brand { text-align: center; background: #16243d; color: #ffffff; padding: 20px; position: relative; } /* Header bar // شريط الترويسة */
    .logo-text { font-family: 'Afeesh', sans-serif; font-weight: 700; font-size: 48px; letter-spacing: 2px; color: #d4af37; } /* Main logo (Arabic) // الشعار الرئيسي (عربي) */
    .logo-sub { font-family: 'Afeesh', sans-serif; font-weight: 600; color: #94a3b8; font-size: 20px; margin-top: 2px; letter-spacing: 3px; } /* Sub‑logo (English) // الشعار الفرعي (إنجليزي) */
    .home-btn { position: absolute; top: 50%; left: 20px; transform: translateY(-50%); color: #d4af37; text-decoration: none; font-size: 15px; background-color: #0f0f10; padding: 9px 12px; border-radius: 999px; } /* Back button // زر الرجوع */

        overflow: hidden; /* Hide overflowing content // إخفاء المحتوى الزائد */
        padding: clamp(10px, 3vw, 20px) clamp(15px, 5vw, 40px); /* Responsive padding // تباعد داخلي متجاوب */
        box-sizing: border-box; /* Include padding in width/height // تضمين الحشوة في العرض/الارتفاع */

        color: #000; /* Black text // نص أسود */
    }

    .bg-text { /* Large "UAE World" background // خلفية "الإمارات العالمية" الكبيرة */
        position: absolute;
        bottom: 0;
        left: auto;
        right: 0; /* Aligned to far right // محاذاة إلى أقصى اليمين */
        transform: none;
        width: 80%; /* Takes 80% width // يأخذ 80% من العرض */
        opacity: 0.15; /* Very faint // خافت جداً */
        z-index: 1; /* Low stacking order // ترتيب منخفض */
        pointer-events: none; /* Not clickable // غير قابل للنقر */
    }
    .camel { /* Camel silhouette // صورة الجمل */
        position: absolute;
        bottom: -10px; /* Slightly below // أسفل قليلاً */
        right: 40px; /* Positioned from right // موضوع من اليمين */
        width: 250px; /* Fixed width // عرض ثابت */
        opacity: 1; /* Fully visible // مرئي بالكامل */
        z-index: 2; /* Above the background // فوق الخلفية */
        pointer-events: none; /* Not clickable // غير قابل للنقر */
    }

    .content-wrapper { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; } /* Wrapper for content above watermarks // حاوية للمحتوى فوق العلامات المائية */

        align-items: center; /* Center children horizontally // توسيط العناصر أفقياً */
    }

        margin-bottom: clamp(20px, 5vw, 45px); /* Bottom margin // هامش سفلي */
        background: #eee; /* Fallback background // خلفية احتياطية */

    .country-text { font-weight: bold; font-size: 16px; margin: 2px 0; color: #000; } /* Arabic country text // نص الدولة بالعربية */

    .copyright { font-size: 14px; color: #555; margin-top: auto; } /* Copyright text // نص حقوق النشر */

    /* ==================== RIGHT COLUMN // العمود الأيمن ==================== */
    .right-col { flex: 1; display: flex; flex-direction: column; } /* Takes remaining width // يأخذ العرض المتبقي */

    .name-details { text-align: center; flex: 1; } /* Name container // حاوية الاسم */
    .name-ar { font-size: clamp(22px, 4vw, 36px); font-weight: 700; margin: 0 0 5px 0; direction: rtl; color: #000; font-family: 'Afeesh', sans-serif; } /* Arabic name // الاسم بالعربية */
    .name-en { font-size: clamp(16px, 2.6vw, 24px); font-weight: normal; margin: 0 0 10px 0; color: #000; } /* English name // الاسم بالإنجليزية */
    .dob { font-size: clamp(14px, 2vw, 18px); margin: 0; color: #333; font-weight: bold; } /* Date of birth // تاريخ الميلاد */

    .health-section { margin-top: 10px; margin-bottom: 0; } /* Health info section // قسم المعلومات الصحية */
    .health-header { /* Bilingual header // عنوان ثنائي اللغة */
        border: 1.5px solid #000; /* Black border // حدود سوداء */
        border-radius: 25px; /* Rounded pill shape // شكل دائري */
        padding: 8px 20px;
        display: flex;
        justify-content: space-between; /* English on left, Arabic on right // إنجليزي يسار، عربي يمين */
        align-items: center;
        margin-bottom: 15px;
        font-weight: bold;
        background-color: rgba(255,255,255,0.9); /* Slightly transparent white // أبيض شفاف قليلاً */
        color: #000;
    }
    .health-header span { font-size: clamp(10px, 1.5vw, 13px); } /* Smaller text for both languages // نص أصغر لكلتا اللغتين */

    .health-tags { display: flex; flex-wrap: wrap; gap: clamp(5px, 1.1vw, 10px); justify-content: flex-start; } /* Container for tags // حاوية للعلامات */
    .tag { /* Individual health tag // علامة صحية فردية */
        border: 1.5px solid #000; border-radius: 20px; padding: clamp(4px, 0.7vw, 6px) clamp(10px, 1.7vw, 15px); 
        display: flex; justify-content: space-between; align-items: center; gap: clamp(8px, 1.7vw, 15px); 
        font-size: clamp(11px, 1.6vw, 14px); background-color: rgba(255,255,255,0.9); 
        min-width: clamp(120px, 22.2vw, 200px); color: #000; opacity: 0; /* Start hidden for animation // يبدأ مخفياً للحركة */
    }
    .tag span:last-child { font-weight: bold; direction: rtl; } /* Arabic part // الجزء العربي */

    /* ==================== FOOTER // التذييل ==================== */
    footer { background: #16243d; color: #ffffff; text-align: center; font-size: 14px; padding: 20px; margin-top: auto; font-family: 'Cairo', sans-serif; }

    /* ==================== ACTION BUTTONS // أزرار الإجراءات ==================== */
    .download-button { /* Download and fullscreen buttons // أزرار التحميل وتكبير الشاشة */
        background: #16243d;
        color: #d4af37;
        border: 2px solid #0f0f10;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s; /* Smooth transition // انتقال سلس */
        box-shadow: 0 2px 0 #0f0f10;
        margin-top: 20px;
        font-family: 'Cairo', sans-serif;
    }
    .download-button:hover { transform: translateY(-2px); box-shadow: 0 4px 0 #0f0f10; } /* Lift on hover // ارتفاع عند التمرير */
    .download-button:active { transform: translateY(0); box-shadow: 0 1px 0 #0f0f10; } /* Press effect // تأثير الضغط */
    
    .actions-container { /* Container for both buttons // حاوية لكلا الزرين */
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px 20px;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    /* ==================== FULLSCREEN STYLES // أنماط وضع ملء الشاشة ==================== */
    .id-card:fullscreen { /* When in fullscreen mode // عند وضع ملء الشاشة */
        width: 100vw; height: 100vh; max-width: none; border-radius: 0; padding: 20px; display: flex; flex-direction: column; justify-content: center; overflow: auto; background-color: #fff;
    }
    .id-card:-webkit-full-screen { /* WebKit fullscreen // ملء الشاشة لمتصفحات WebKit */
        width: 100vw; height: 100vh; max-width: none; border-radius: 0; padding: 20px; display: flex; flex-direction: column; justify-content: center; overflow: auto; background-color: #fff;
    }

    /* ==================== ANIMATIONS // الحركات ==================== */
    @keyframes fadeInUp { /* Fade in and slide up // ظهور مع انزلاق لأعلى */
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-in { opacity: 0; animation: fadeInUp 0.6s ease-out forwards; } /* Apply animation // تطبيق الحركة */
</style>
</head>

    };

    const allergiesData = { // Allergies list in both languages // قائمة الحساسيات باللغتين
      ar: ["💪 لا يوجد", "🥛 حليب", "🥚 بيض", "🥜 فول سوداني", "🌰 مكسرات", "🐟 سمك", "🍤 روبيان", "🌾 قمح", "🫘 صويا", "🌰 لوز", "🌰 كاجو", "🌰 جوز", "🌰 فستق", "🌰 بندق", "🍓 فراولة", "🍅 طماطم", "🍫 شوكولاتة", "☕ قهوة", "🍯 عسل", "🐄 حليب بقر"],
      en: ["💪 None", "🥛 Milk", "🥚 Eggs", "🥜 Peanuts", "🌰 Tree nuts", "🐟 Fish", "🍤 Shrimp", "🌾 Wheat", "🫘 Soy", "🌰 Almonds", "🌰 Cashews", "🌰 Walnuts", "🌰 Pistachios", "🌰 Hazelnuts", "🍓 Strawberries", "🍅 Tomatoes", "🍫 Chocolate", "☕ Coffee", "🍯 Honey", "🐄 Cow milk"]
    };

    const medicalConditionsData = { // Medical conditions list in both languages // قائمة الحالات الطبية باللغتين
      ar: ["💪 لا يوجد", "💉 السكري", "🫀 ضغط الدم", "🫁 الربو", "😰 القلق", "👁️ عمى الألوان", "😔 الاكتئاب", "😴 الأرق", "🦴 التهاب المفاصل", "🤕 الصداع النصفي", "💓 أمراض القلب", "⚡ الصرع", "🔙 ألم الظهر", "👓 ضعف النظر", "🩸 فقر الدم", "⚖️ السمنة", "🫘 أمراض الكلى", "🦠 ضعف المناعة"],
      en: ["💪 None", "💉 Diabetes", "🫀 High Blood Pressure", "🫁 Asthma", "😰 Anxiety", "👁️ Color Blindness", "😔 Depression", "😴 Insomnia", "🦴 Arthritis", "🤕 Migraine", "💓 Heart Disease", "⚡ Epilepsy", "🔙 Back Pain", "👓 Poor Eyesight", "🩸 Anemia", "⚖️ Obesity", "🫘 Kidney Disease", "🦠 Immunodeficiency"]
    };

    document.addEventListener('DOMContentLoaded', () => { // Run when DOM is ready // يعمل عندما يكون DOM جاهزاً
        const profile = JSON.parse(localStorage.getItem('hayyak_user_profile') || '{}'); // Load user profile from localStorage // تحميل ملف المستخدم من التخزين المحلي
        
        // Apply theme from user profile // تطبيق السمة من ملف المستخدم
        if (profile.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark'); // Set dark theme attribute // تعيين سمة السمة الداكنة
        }
        
        // ==================== NAME LOGIC // منطق الاسم ====================
        const nameArEl = document.getElementById('id-name-ar'); // Arabic name element // عنصر الاسم العربي
        const nameEnEl = document.getElementById('id-name-en'); // English name element // عنصر الاسم الإنجليزي
        
        if (profile.nameAr && profile.nameAr.trim() !== "") { // If Arabic name exists // إذا كان الاسم العربي موجوداً
            nameArEl.textContent = profile.nameAr; // Set Arabic name // تعيين الاسم العربي
        } else {
            nameArEl.style.display = 'none'; // Hide if empty // إخفاء إذا كان فارغاً
        }
        
        if (profile.nameEn && profile.nameEn.trim() !== "") { // If English name exists // إذا كان الاسم الإنجليزي موجوداً
            nameEnEl.textContent = profile.nameEn; // Set English name // تعيين الاسم الإنجليزي
        } else {
            nameEnEl.style.display = 'none'; // Hide if empty // إخفاء إذا كان فارغاً
        }
        
        // Date of Birth // تاريخ الميلاد
        if (profile.dob) { // If DOB exists // إذا كان تاريخ الميلاد موجوداً
            document.getElementById('id-dob').textContent = profile.dob; // Set DOB // تعيين تاريخ الميلاد
        }

        // Profile Picture // صورة الملف الشخصي
        const avatar = localStorage.getItem('hayyak_user_avatar'); // Get avatar from localStorage // الحصول على الصورة الرمزية من التخزين المحلي
        if (avatar) { // If avatar exists // إذا كانت الصورة موجودة
            document.getElementById('id-profile-pic').src = avatar; // Set profile picture // تعيين صورة الملف الشخصي
        }

        // ==================== HEALTH TAGS // العلامات الصحية ====================
        const tagsContainer = document.getElementById('id-health-tags'); // Container for tags // حاوية العلامات
        // Combine all selected items (allergies, medical conditions, phobias) // دمج جميع العناصر المحددة (حساسيات، حالات طبية، فوبيا)
        const items = [
            ...(profile.allergies || []),
            ...(profile.medicalConditions || []),
            ...(profile.phobias || [])
        ];

        // Helper function to find translation pair for an item // دالة مساعدة للعثور على زوج الترجمة لعنصر
        function getPair(item) {
            const lists = [phobiasData, allergiesData, medicalConditionsData]; // All data lists // جميع قوائم البيانات
            for (const list of lists) { // Loop through each list // التكرار على كل قائمة
                const arIndex = list.ar.indexOf(item); // Look for item in Arabic list // البحث عن العنصر في القائمة العربية
                if (arIndex !== -1) return { ar: list.ar[arIndex], en: list.en[arIndex] }; // Return pair if found // إرجاع الزوج إذا وجد
                
                const enIndex = list.en.indexOf(item); // Look for item in English list // البحث عن العنصر في القائمة الإنجليزية
                if (enIndex !== -1) return { ar: list.ar[enIndex], en: list.en[enIndex] }; // Return pair if found // إرجاع الزوج إذا وجد
            }
            // If not found in predefined lists (custom item), return item as both // إذا لم يوجد في القوائم المحددة مسبقاً (عنصر مخصص)، إرجاع العنصر نفسه لكلتا اللغتين
            return { ar: item, en: item };
        }

        items.forEach(item => { // Loop through each selected item // التكرار على كل عنصر محدد
            if (item === "None" || item === "لا يوجد" || item.includes("None") || item.includes("لا يوجد")) return; // Skip "None" entries // تخطي إدخالات "لا يوجد"
            
            const pair = getPair(item); // Get translation pair // الحصول على زوج الترجمة
            // Remove emojis for cleaner ID look (keep only text) // إزالة الرموز التعبيرية لمظهر أنظف (الاحتفاظ بالنص فقط)
            const cleanEn = pair.en.replace(/^[^\w\s]+/, '').trim(); // English part without leading emoji // الجزء الإنجليزي بدون الرمز التعبيري
            const cleanAr = pair.ar.replace(/^[^\w\s\u0600-\u06FF]+/, '').trim(); // Arabic part without leading emoji // الجزء العربي بدون الرمز التعبيري

            const tag = document.createElement('div'); // Create a div for the tag // إنشاء div للعلامة
            tag.className = 'tag'; // Assign class // تعيين الكلاس
            tag.innerHTML = `<span>${cleanEn}</span><span>${cleanAr}</span>`; // Set bilingual content // تعيين المحتوى ثنائي اللغة
            tagsContainer.appendChild(tag); // Add to container // إضافة إلى الحاوية
        });

        // ==================== STAGGERED ANIMATION FOR TAGS // حركة متدرجة للعلامات ====================
        const tags = document.querySelectorAll('.health-tags .tag'); // Select all tags // تحديد جميع العلامات
        tags.forEach((tag, index) => { // Loop through tags // التكرار على العلامات
            tag.style.animation = `fadeInUp 0.5s ease-out forwards ${0.6 + index * 0.08}s`; // Apply animation with delay // تطبيق الحركة مع تأخير
        });
    });

    // ==================== DOWNLOAD FUNCTION // دالة التحميل ====================
    function downloadIdCard() { // Capture the ID card as an image and download // التقاط البطاقة كصورة وتحميلها
        const card = document.querySelector('.id-card'); // Select the card element // تحديد عنصر البطاقة
        const btn = document.getElementById('download-btn'); // Download button // زر التحميل
        const originalText = btn.innerHTML; // Store original button text // تخزين نص الزر الأصلي
        btn.innerHTML = '<span>...</span>'; // Show loading // إظهار التحميل
        btn.disabled = true; // Disable button // تعطيل الزر

        html2canvas(card, { // Use html2canvas to render the card // استخدام html2canvas لرسم البطاقة
            scale: 3, // Higher scale for better quality // مقياس أعلى لجودة أفضل
            useCORS: true, // Enable CORS for external images // تمكين CORS للصور الخارجية
            backgroundColor: null // Transparent background // خلفية شفافة
        }).then(canvas => { // On success // عند النجاح
            const link = document.createElement('a'); // Create download link // إنشاء رابط تحميل
            link.download = 'HAYYAK_ID.png'; // Set filename // تعيين اسم الملف
            link.href = canvas.toDataURL('image/png'); // Convert canvas to PNG data URL // تحويل اللوحة إلى رابط بيانات PNG
            link.click(); // Trigger download // تشغيل التحميل
            btn.innerHTML = originalText; // Restore button text // استعادة نص الزر
            btn.disabled = false; // Re-enable button // إعادة تمكين الزر
        }).catch(err => { // On error // عند الخطأ
            console.error('Download failed:', err); // Log error // تسجيل الخطأ
            btn.innerHTML = '<span>Error!</span>'; // Show error // إظهار الخطأ
            setTimeout(() => {
                btn.innerHTML = originalText; // Restore after timeout // الاستعادة بعد مهلة
                btn.disabled = false;
            }, 2000);
        });
    }

    document.getElementById('download-btn').addEventListener('click', downloadIdCard); // Attach click event // ربط حدث النقر
    
    // ==================== FULLSCREEN FUNCTION // دالة ملء الشاشة ====================
    function toggleFullScreen() { // Toggle fullscreen mode for the card // تبديل وضع ملء الشاشة للبطاقة
        const card = document.querySelector('.id-card'); // Select the card // تحديد البطاقة
        if (!document.fullscreenElement && !document.webkitFullscreenElement) { // If not in fullscreen // إذا لم يكن في وضع ملء الشاشة
            if (card.requestFullscreen) { // Standard fullscreen // ملء الشاشة القياسي
                card.requestFullscreen();
            } else if (card.webkitRequestFullscreen) { // WebKit fullscreen // ملء الشاشة لمتصفحات WebKit
                card.webkitRequestFullscreen();
            }
        } else { // If already in fullscreen // إذا كان بالفعل في وضع ملء الشاشة
            if (document.exitFullscreen) { // Exit fullscreen // الخروج من ملء الشاشة
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { // WebKit exit // الخروج لمتصفحات WebKit
                document.webkitExitFullscreen();
            }
        }
    }
    
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullScreen); // Attach click event // ربط حدث النقر
  </script>
</body>
</html>
