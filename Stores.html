<!DOCTYPE html>
<!-- Defines the document type as HTML5 // يحدد نوع المستند كـ HTML5 -->
<html lang="ar" dir="rtl">
<!-- Root element, language Arabic, direction right-to-left // العنصر الجذري، اللغة العربية، الاتجاه من اليمين لليسار -->
<head>
  <meta charset="utf-8" />
  <!-- Sets character encoding to UTF-8 (supports Arabic) // يضبط ترميز الأحرف إلى UTF-8 (يدعم العربية) -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Makes page responsive on mobile devices // يجعل الصفحة متجاوبة مع الأجهزة المحمولة -->
  <title>HAYYAK | Shopping</title>
  <!-- Page title // عنوان الصفحة -->
  <meta name="description" content="أماكن الترفيه في دبي - مع تصفية حسب الموقع والتقييم والسعر والمسافة" />
  <!-- Meta description for SEO (Arabic) // وصف تعريفي لمحركات البحث (بالعربية) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Preconnect to Google Fonts domain // اتصال مسبق بنطاق خطوط جوجل -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Preconnect with cross-origin attribute // اتصال مسبق مع خاصية عبر المصدر -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Loads Cairo font from Google Fonts // تحميل خط Cairo من خطوط جوجل -->
  <link rel="icon" type="image/jpeg" href="Images/Favicon.jpeg">
  <!-- Favicon (browser tab icon) // أيقونة علامة تبويب المتصفح -->
  <script src="js/search_index.js"></script>
  <!-- External JavaScript file containing search index data // ملف جافا سكريبت خارجي يحتوي على بيانات فهرس البحث -->
  <style>
    /* ==================== FONT DEFINITIONS // تعريفات الخطوط ==================== */
    /* Afeesh family (local) - defines custom fonts // عائلة Afeesh (محلية) - تعريف خطوط مخصصة */
    @font-face {
      font-family: 'Afeesh'; /* Assigns a name to this font variant // يعين اسمًا لمتغير الخط هذا */
      src: url('afeesh/Afeesh-Aadi.woff2') format('woff2'), /* WOFF2 format (modern) // تنسيق WOFF2 (حديث) */
           url('afeesh/Afeesh-Aadi.woff') format('woff'), /* WOFF format (fallback) // تنسيق WOFF (احتياطي) */
           url('afeesh/Afeesh-Aadi.ttf') format('truetype'); /* TrueType format (older) // تنسيق TrueType (قديم) */
      font-weight: 400; /* Normal weight // وزن عادي */
      font-style: normal; /* Normal style // نمط عادي */
      font-display: swap; /* Shows fallback font while loading custom // عرض خط احتياطي أثناء تحميل الخط المخصص */
    }
    @font-face {
      font-family: 'Afeesh'; /* Same family name // نفس اسم العائلة */
      src: url('afeesh/Afeesh-Mekalbaz.woff2') format('woff2'),
           url('afeesh/Afeesh-Mekalbaz.woff') format('woff'),
           url('afeesh/Afeesh-Mekalbaz.ttf') format('truetype');
      font-weight: 700; /* Bold weight // وزن عريض */
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Afeesh';
      src: url('afeesh/Afeesh-NosMekalbaz.woff2') format('woff2'),
           url('afeesh/Afeesh-NosMekalbaz.woff') format('woff'),
           url('afeesh/Afeesh-NosMekalbaz.ttf') format('truetype');
      font-weight: 600; /* Semi-bold // شبه عريض */
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Afeesh';
      src: url('afeesh/Afeesh-NosMesalwa.woff2') format('woff2'),
           url('afeesh/Afeesh-NosMesalwa.woff') format('woff'),
           url('afeesh/Afeesh-NosMesalwa.ttf') format('truetype');
      font-weight: 300; /* Light // خفيف */
      font-style: normal;
      font-display: swap;
    }

    /* ==================== CSS VARIABLES (THEME) // متغيرات CSS (السمة) ==================== */
    :root {
      --bg: #f5f5f7;        /* Light mode background // خلفية الوضع الفاتح */
      --card: #ffffff;       /* Card background // خلفية البطاقة */
      --ink: #0f0f10;        /* Main text color // لون النص الرئيسي */
      --muted: #6b7280;      /* Muted text // نص باهت */
      --line: #0f0f10;       /* Border color // لون الحدود */
      --radius: 14px;        /* Border radius // نصف قطر الحدود */
    }
    [data-theme="dark"] {    /* Dark mode overrides // تجاوزات الوضع الداكن */
      --bg: #121212;         /* Dark background // خلفية داكنة */
      --card: #1e1e1e;       /* Dark card // بطاقة داكنة */
      --ink: #ffffff;        /* Light text // نص فاتح */
      --muted: #a0a0a0;      /* Muted grey // رمادي باهت */
      --line: #333333;       /* Dark border // حدود داكنة */
    }

    /* ==================== GLOBAL RESETS // إعادة تعيين عامة ==================== */
    * {
      box-sizing: border-box; /* Include padding/border in width/height // تضمين الحشوة/الحدود في العرض/الارتفاع */
    }
    html, body {
      height: 100%;          /* Full height // ارتفاع كامل */
      background: var(--bg); /* Background from theme // خلفية من السمة */
    }
    body {
      margin: 0;             /* Remove default margin // إزالة الهامش الافتراضي */
      font-family: 'Cairo', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; /* Font stack // مجموعة الخطوط */
      color: var(--ink);     /* Text color from theme // لون النص من السمة */
    }

    /* ==================== LAYOUT COMPONENTS // مكونات التخطيط ==================== */
    .shell {
      width: 100%;           /* Full width // عرض كامل */
      max-width: 420px;      /* Limit width on large screens // تحديد العرض على الشاشات الكبيرة */
      margin: 0 auto;        /* Center horizontally // توسيط أفقي */
      padding: 16px;         /* Inner spacing // حشوة داخلية */
    }
    .card {
      background: var(--card); /* Card background from theme // خلفية البطاقة من السمة */
      border: 2px solid var(--line); /* Border using theme line color // حدود بلون الخط من السمة */
      border-radius: var(--radius); /* Rounded corners using variable // زوايا دائرية باستخدام المتغير */
      box-shadow: 0 2px 0 #0f0f10; /* Small shadow for depth // ظل صغير للعمق */
    }

    /* ==================== HEADER // الترويسة ==================== */
    header.brand {
      text-align: center;    /* Center align text // محاذاة النص للوسط */
      background: #16243d;   /* Dark blue background // خلفية زرقاء داكنة */
      color: #ffffff;        /* White text // نص أبيض */
      padding: 20px;         /* Padding around content // حشوة حول المحتوى */
      position: relative;    /* For absolute positioning of children // لتحديد موضع العناصر الفرعية بشكل مطلق */
    }
    .logo-text {
      font-family: 'Afeesh', sans-serif; /* Use Afeesh font // استخدام خط Afeesh */
      font-weight: 700;      /* Bold // عريض */
      font-size: 48px;       /* Large font // خط كبير */
      letter-spacing: 2px;   /* Space between letters // مسافة بين الأحرف */
      color: #d4af37;        /* Gold color // لون ذهبي */
    }
    .logo-sub {
      font-family: 'Afeesh', sans-serif; /* Afeesh font // خط Afeesh */
      font-weight: 600;      /* Semi-bold // شبه عريض */
      color: #94a3b8;        /* Greyish blue // أزرق رمادي */
      font-size: 20px;       /* Font size // حجم الخط */
      margin-top: 2px;       /* Small top margin // هامش علوي صغير */
      letter-spacing: 3px;   /* More spacing between letters // مسافة أكبر بين الأحرف */
    }
    .home-btn {
      position: absolute;    /* Absolute positioning inside header // تحديد موضع مطلق داخل الترويسة */
      top: 50%;              /* Center vertically // توسيط عمودي */
      left: 20px;            /* Distance from left (RTL) // مسافة من اليسار (RTL) */
      transform: translateY(-50%); /* Perfect vertical centering // توسيط عمودي مثالي */
      color: #d4af37;        /* Gold text // نص ذهبي */
      text-decoration: none; /* Remove underline // إزالة التسطير */
      font-size: 15px;       /* Font size // حجم الخط */
      background-color: #0f0f10; /* Dark background // خلفية داكنة */
      padding: 9px 12px;     /* Padding // حشوة */
      border-radius: 999px;  /* Pill shape // شكل كبسولة */
    }

    /* Translate Button Styles // أنماط زر الترجمة */
    .translate-btn {
      position: absolute;    /* Absolute positioning // تحديد موضع مطلق */
      top: 50%;              /* Center vertically // توسيط عمودي */
      right: 20px;           /* Distance from right (RTL) // مسافة من اليمين (RTL) */
      transform: translateY(-50%); /* Perfect vertical centering // توسيط عمودي مثالي */
      background: #d4af37;   /* Gold background // خلفية ذهبية */
      border: 2px solid #ffffff; /* White border // حدود بيضاء */
      border-radius: 20px;   /* Rounded shape // شكل دائري */
      color: #16243d;        /* Dark blue text // نص أزرق داكن */
      padding: 6px 14px;     /* Padding // حشوة */
      font-weight: 700;      /* Bold // عريض */
      font-size: 13px;       /* Font size // حجم الخط */
      cursor: pointer;       /* Pointer cursor on hover // مؤشر اليد عند التمرير */
      display: flex;         /* Flexbox for icon and text // مرن للأيقونة والنص */
      align-items: center;   /* Vertically align items // محاذاة عمودية للعناصر */
      gap: 6px;              /* Gap between icon and text // فجوة بين الأيقونة والنص */
      transition: all 0.3s ease; /* Smooth transition // انتقال سلس */
      box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3); /* Gold shadow // ظل ذهبي */
      z-index: 100;          /* Ensure it's above other elements // ضمان أنه فوق العناصر الأخرى */
    }
    .translate-btn:hover {
      transform: translateY(-50%) scale(1.05); /* Zoom on hover // تكبير عند التمرير */
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.5); /* Stronger shadow // ظل أقوى */
      background: #f7ef8a;   /* Lighter gold // ذهبي أفتح */
    }
    .translate-btn .icon {
      font-size: 16px;       /* Globe icon size // حجم أيقونة الكرة الأرضية */
      transition: transform 0.3s ease; /* Smooth rotation // دوران سلس */
    }
    .translate-btn:hover .icon {
      transform: rotate(20deg); /* Rotate icon on hover // تدوير الأيقونة عند التمرير */
    }
    .translate-btn.switching {
      animation: pulse 0.5s ease; /* Pulse animation when switching language // حركة نبض عند تبديل اللغة */
    }
    @keyframes pulse {
      0% { transform: translateY(-50%) scale(1); }
      50% { transform: translateY(-50%) scale(0.9); }
      100% { transform: translateY(-50%) scale(1); }
    }

    /* ==================== MAP // الخريطة ==================== */
    .map {
      height: 180px;         /* Fixed height // ارتفاع ثابت */
      border-radius: var(--radius); /* Rounded corners // زوايا دائرية */
      overflow: hidden;      /* Hide overflow (for iframe) // إخفاء الزيادة (لـ iframe) */
      position: relative;    /* For any absolute overlays // لأي تراكبات مطلقة */
      border: 2px solid var(--line); /* Border using theme // حدود باستخدام السمة */
    }
    .map iframe {
      width: 100%;           /* Full width // عرض كامل */
      height: 100%;          /* Full height // ارتفاع كامل */
      border: 0;             /* No border // بلا حدود */
    }

    /* ==================== SECTION TITLE // عنوان القسم ==================== */
    .section-title {
      display: flex;         /* Flex layout // تخطيط مرن */
      align-items: center;   /* Center vertically // توسيط عمودي */
      justify-content: center; /* Center horizontally // توسيط أفقي */
      gap: 10px;             /* Gap between emoji and text // فجوة بين الإيموجي والنص */
      margin: 14px 0 10px;   /* Vertical margins // هوامش رأسية */
      font-weight: 700;      /* Bold // عريض */
      font-size: 20px;       /* Font size // حجم الخط */
    }
    .section-title .emoji {
      font-size: 22px;       /* Larger emoji // إيموجي أكبر */
    }

    /* ==================== LIST ITEMS // عناصر القائمة ==================== */
    .list {
      display: grid;         /* Grid layout // تخطيط شبكي */
      gap: 10px;             /* Gap between items // فجوة بين العناصر */
    }
    .item {
      display: grid;         /* Grid inside item // شبكة داخل العنصر */
      grid-template-columns: 36px 1fr; /* Icon column and content column // عمود للأيقونة وعمود للمحتوى */
      align-items: center;   /* Center vertically // توسيط عمودي */
      gap: 10px;             /* Gap between columns // فجوة بين الأعمدة */
      border: 2px solid var(--line); /* Border // حدود */
      border-radius: 999px;  /* Pill shape // شكل كبسولة */
      background: var(--card); /* Background from theme // خلفية من السمة */
      padding: 8px 12px;     /* Padding // حشوة */
      cursor: pointer;       /* Pointer cursor // مؤشر اليد */
      transition: background 0.2s; /* Smooth background change // تغيير خلفية سلس */
    }
    .item:hover {
      background: #f5f5f7;   /* Light grey on hover // رمادي فاتح عند التمرير */
    }
    .pin {
      display: grid;         /* Center the icon // توسيط الأيقونة */
      place-items: center;   /* Center both axes // توسيط في كلا المحورين */
      font-size: 22px;       /* Icon size // حجم الأيقونة */
    }
    .label {
      font-weight: 700;      /* Bold name // اسم عريض */
      display: flex;         /* Flex // مرن */
      flex-direction: column; /* Stack vertically // تكديس رأسي */
      gap: 4px;              /* Gap between lines // فجوة بين الأسطر */
    }
    .distance-badge {
      font-size: 12px;       /* Small font // خط صغير */
      color: var(--muted);   /* Muted color // لون باهت */
      font-weight: 400;      /* Normal weight // وزن عادي */
    }
    .rating-badge {
      font-size: 12px;       /* Font size // حجم الخط */
      background: #fbbf24;   /* Yellow background // خلفية صفراء */
      color: #000;           /* Black text // نص أسود */
      padding: 2px 6px;      /* Padding // حشوة */
      border-radius: 6px;    /* Rounded corners // زوايا دائرية */
      width: fit-content;    /* Fit content width // عرض حسب المحتوى */
    }

    /* ==================== CONTROLS (FILTERS) // عناصر التحكم (التصفية) ==================== */
    .controls {
      display: grid;         /* Grid layout // تخطيط شبكي */
      gap: 10px;             /* Gap between groups // فجوة بين المجموعات */
      margin: 14px 0;        /* Vertical margins // هوامش رأسية */
    }
    .filter-group {
      display: grid;         /* Grid layout // تخطيط شبكي */
      gap: 8px;              /* Gap inside group // فجوة داخل المجموعة */
    }
    .filter-label {
      font-weight: 700;      /* Bold // عريض */
      font-size: 14px;       /* Font size // حجم الخط */
      color: var(--muted);   /* Muted color // لون باهت */
    }
    .city-select {
      width: 100%;           /* Full width // عرض كامل */
      padding: 10px 12px;    /* Padding // حشوة */
      border: 2px solid var(--line); /* Border // حدود */
      border-radius: var(--radius); /* Rounded corners // زوايا دائرية */
      background: var(--card); /* Background // خلفية */
      color: var(--ink);     /* Text color // لون النص */
      font: inherit;         /* Inherit font // وراثة الخط */
      cursor: pointer;       /* Pointer cursor // مؤشر اليد */
    }
    .sort-buttons {
      display: grid;         /* Grid // شبكة */
      grid-template-columns: 1fr 1fr 1fr; /* Three equal columns // ثلاثة أعمدة متساوية */
      gap: 8px;              /* Gap between buttons // فجوة بين الأزرار */
    }
    .sort-btn {
      padding: 10px 8px;     /* Padding // حشوة */
      border: 2px solid var(--line); /* Border // حدود */
      border-radius: var(--radius); /* Rounded corners // زوايا دائرية */
      background: var(--card); /* Background // خلفية */
      color: var(--ink);     /* Text color // لون النص */
      cursor: pointer;       /* Pointer cursor // مؤشر اليد */
      font: inherit;         /* Inherit font // وراثة الخط */
      font-weight: 600;      /* Semi-bold // شبه عريض */
      font-size: 12px;       /* Font size // حجم الخط */
      transition: all 0.2s;  /* Smooth transition // انتقال سلس */
    }
    .sort-btn.active {
      background: #d4af37;   /* Gold background when active // خلفية ذهبية عند التفعيل */
      color: #16243d;        /* Dark blue text // نص أزرق داكن */
      border-color: #16243d; /* Dark blue border // حدود زرقاء داكنة */
    }
    .sort-btn:hover {
      background: #f5f5f7;   /* Light grey on hover // رمادي فاتح عند التمرير */
    }

    /* ==================== INFO PANEL // لوحة المعلومات ==================== */
    .info-panel {
      display: none;         /* Hidden by default // مخفي افتراضيًا */
      margin-top: 10px;      /* Top margin // هامش علوي */
      padding: 14px;         /* Padding // حشوة */
      animation: fade 0.4s;  /* Fade animation // حركة ظهور */
    }
    .info-panel.active {
      display: block;        /* Show when active // يظهر عند التفعيل */
    }
    .info-desc {
      font-size: 14px;       /* Font size // حجم الخط */
      line-height: 1.6;      /* Line height // ارتفاع السطر */
      color: var(--muted);   /* Muted color // لون باهت */
      margin-bottom: 16px;   /* Bottom margin // هامش سفلي */
    }
    .info-grid {
      display: grid;         /* Grid // شبكة */
      grid-template-columns: 1fr 1fr; /* Two columns // عمودان */
      gap: 10px;             /* Gap // فجوة */
    }
    .info-box {
      background: var(--bg); /* Background // خلفية */
      padding: 12px;         /* Padding // حشوة */
      border-radius: 12px;   /* Rounded corners // زوايا دائرية */
      text-align: center;    /* Center text // توسيط النص */
      display: flex;         /* Flex column // عمود مرن */
      flex-direction: column; /* Stack vertically // تكديس رأسي */
      align-items: center;   /* Center horizontally // توسيط أفقي */
      gap: 4px;              /* Gap // فجوة */
    }
    .ib-icon {
      font-size: 24px;       /* Icon size // حجم الأيقونة */
      margin-bottom: 4px;    /* Bottom margin // هامش سفلي */
    }
    .ib-label {
      font-size: 12px;       /* Label size // حجم التسمية */
      color: var(--muted);   /* Muted color // لون باهت */
      font-weight: 600;      /* Semi-bold // شبه عريض */
    }
    .ib-val {
      font-size: 14px;       /* Value size // حجم القيمة */
      font-weight: 700;      /* Bold // عريض */
      color: var(--ink);     /* Text color // لون النص */
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== SEARCH // البحث ==================== */
    .bottom-search {
      padding: 12px 0 18px;  /* Vertical padding // حشوة رأسية */
      position: relative;    /* For autocomplete positioning // لتحديد موضع الإكمال التلقائي */
    }
    .search {
      display: grid;         /* Grid layout // تخطيط شبكي */
      grid-template-columns: 28px 1fr; /* Icon and input // أيقونة وحقل إدخال */
      align-items: center;   /* Vertically center // توسيط عمودي */
      gap: 8px;              /* Gap // فجوة */
      border: 2px solid var(--line); /* Border // حدود */
      border-radius: 999px;  /* Pill shape // شكل كبسولة */
      padding: 10px 12px;    /* Padding // حشوة */
      background: var(--card); /* Background // خلفية */
    }
    .glass {
      text-align: center;    /* Center icon // توسيط الأيقونة */
    }
    .search input {
      appearance: none;      /* Remove default styling // إزالة التنسيق الافتراضي */
      border: 0;             /* No border // بلا حدود */
      outline: 0;            /* No outline // بلا مخطط */
      background: transparent; /* Transparent background // خلفية شفافة */
      width: 100%;           /* Full width // عرض كامل */
      font: inherit;         /* Inherit font // وراثة الخط */
      color: var(--ink);     /* Text color // لون النص */
    }
    .search input::placeholder {
      color: var(--muted);   /* Placeholder color // لون النص المؤقت */
    }

    /* ==================== AUTOCOMPLETE // الإكمال التلقائي ==================== */
    .autocomplete-list {
      display: none;         /* Hidden by default // مخفي افتراضيًا */
      position: absolute;    /* Absolute positioning // تحديد موضع مطلق */
      top: 100%;             /* Below search bar // أسفل شريط البحث */
      left: 0; right: 0;     /* Full width // عرض كامل */
      background: var(--card); /* Background // خلفية */
      border: 2px solid var(--line); /* Border // حدود */
      border-top: 0;         /* Remove top border // إزالة الحد العلوي */
      border-radius: 0 0 var(--radius) var(--radius); /* Rounded bottom corners // زوايا سفلية دائرية */
      max-height: 200px;     /* Max height // أقصى ارتفاع */
      overflow-y: auto;      /* Scroll if needed // تمرير إذا لزم */
      z-index: 100;          /* Above other content // فوق المحتوى الآخر */
    }
    .autocomplete-list.active {
      display: block;        /* Show when active // يظهر عند التفعيل */
    }
    .autocomplete-item {
      padding: 12px;         /* Padding // حشوة */
      border-bottom: 1px solid var(--line); /* Bottom border // حد سفلي */
      cursor: pointer;       /* Pointer cursor // مؤشر اليد */
      transition: background 0.2s; /* Smooth background // خلفية سلسة */
    }
    .autocomplete-item:hover {
      background: #f5f5f7;   /* Light grey // رمادي فاتح */
    }
    .autocomplete-item:last-child {
      border-bottom: none;   /* No border on last // بلا حدود للأخير */
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      // Calculate distance in km between two coordinates using Haversine formula // حساب المسافة بالكيلومترات بين إحداثيتين باستخدام صيغة هافرسين
      const R = 6371; // Earth radius in km // نصف قطر الأرض بالكيلومتر
      const dLat = (lat2 - lat1) * Math.PI / 180; // Difference in latitude in radians // فرق خط العرض بالراديان
      const dLon = (lon2 - lon1) * Math.PI / 180; // Difference in longitude in radians // فرق خط الطول بالراديان
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); // Haversine formula // صيغة هافرسين
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); // Central angle // الزاوية المركزية
      return (R * c).toFixed(1); // Distance in km // المسافة بالكيلومتر
    }

    function checkIfPlaceUnsuitableForUser(place) {
      // Check if place conflicts with user's phobias // التحقق مما إذا كان المكان يتعارض مع فوبيا المستخدم
      const profile = JSON.parse(localStorage.getItem('hayyak_user_profile') || '{}');
      const userPhobias = profile.phobias || [];
      
      // Mapping of phobias to trigger keywords relevant to stores // تعيين الفوبيا إلى كلمات مفتاحية ذات صلة بالمتاجر
      const phobiaRestrictions = {
        '📦 فوبيا الأماكن المغلقة': ['Mall', 'Indoor', 'Center', 'مول', 'مركز', 'مغلق'],
        '🏙️ فوبيا الأماكن المفتوحة/المزدحمة': ['Mall', 'Souq', 'Market', 'Crowd', 'City Walk', 'مول', 'سوق', 'مزدحم', 'ممشى'],
        '🧗 فوبيا المرتفعات': ['Floor', 'High', 'طابق', 'عالي']
      };
      
      for (const [phobia, triggers] of Object.entries(phobiaRestrictions)) { // Loop through phobias // التكرار على الفوبيا
        if (userPhobias.includes(phobia)) { // If user has this phobia // إذا كان المستخدم يعاني من هذه الفوبيا
          for (const trigger of triggers) { // Check each trigger // التحقق من كل محفز
            const name = (place.name || '').toLowerCase(); // Arabic name // الاسم بالعربية
            const nameEn = (place.nameEn || '').toLowerCase(); // English name // الاسم بالإنجليزية
            const desc = (place.desc || '').toLowerCase(); // Arabic description // الوصف بالعربية
            const descEn = (place.descEn || '').toLowerCase(); // English description // الوصف بالإنجليزية
            const t = trigger.toLowerCase(); // Trigger in lowercase // المحفز بأحرف صغيرة
            
            if (name.includes(t) || nameEn.includes(t) || desc.includes(t) || descEn.includes(t)) {
              return true; // Place is unsuitable // المكان غير مناسب
            }
          }
        }
      }
      return false; // Place is suitable // المكان مناسب
    }

    // Main filtering: if search query active → search all cities, else current city
    // التصفية الرئيسية: إذا كان استعلام البحث نشطًا → البحث في جميع المدن، وإلا المدينة الحالية
    function filterAndSort() {
      let places; // Variable to hold places to filter // متغير لتخزين الأماكن المراد تصفيتها
      if (currentSearchQuery) { // If there is a search query // إذا كان هناك استعلام بحث
        const q = currentSearchQuery.toLowerCase(); // Convert query to lowercase // تحويل الاستعلام إلى أحرف صغيرة
        places = globalPlaces.filter(p => // Filter global places // تصفية الأماكن العالمية
          (p.name && p.name.toLowerCase().includes(q)) || 
          (p.nameEn && p.nameEn.toLowerCase().includes(q)) ||
          (p.desc && p.desc.toLowerCase().includes(q)) ||
          (p.descEn && p.descEn.toLowerCase().includes(q))
        );
      } else {
        places = allPlaces[currentCity] || []; // Use current city's places // استخدام أماكن المدينة الحالية
      }
      
      filteredPlaces = places.map(p => ({ // Map places to include distance // تعيين الأماكن لتضمين المسافة
        ...p, // Spread original properties // نشر الخصائص الأصلية
        distance: calculateDistance(userLocation.lat, userLocation.lon, p.lat, p.lon) // Calculate distance // حساب المسافة
      }));

      // Sort according to currentSort // الترتيب حسب currentSort
      if (currentSort === 'nearest') filteredPlaces.sort((a,b) => parseFloat(a.distance) - parseFloat(b.distance)); // Nearest first // الأقرب أولاً
      else if (currentSort === 'rating') filteredPlaces.sort((a,b) => b.rating - a.rating); // Highest rating first // الأعلى تقييماً أولاً
      else if (currentSort === 'price') filteredPlaces.sort((a,b) => { // Cheapest first // الأرخص أولاً
        const pa = a.price === 'متفاوت' || a.price === '0' || a.price === 'متوسط الأسعار' ? 999 : parseInt(a.price); // Normalize price // توحيد السعر
        const pb = b.price === 'متفاوت' || b.price === '0' || b.price === 'متوسط الأسعار' ? 999 : parseInt(b.price);
        return pa - pb;
      });

      renderPlaces(filteredPlaces.slice(0, 4)); // Render first 4 places // عرض أول 4 أماكن
    }

    // Render list items – IMAGE REMOVED per request // عرض عناصر القائمة - تمت إزالة الصورة حسب الطلب

        item.className = 'item'; // Add class // إضافة الفئة
        item.onclick = () => showPlace(p); // Set click handler to show info // تعيين معالج النقر لإظهار المعلومات
        
        const name = currentLanguage === 'ar' ? p.name : (p.nameEn || p.name); // Get name in current language // الحصول على الاسم باللغة الحالية
        const distanceText = currentLanguage === 'ar' ? `${p.distance} كم` : `${p.distance} km`; // Distance text // نص المسافة
        const ratingText = `⭐ ${p.rating}`; // Rating text // نص التقييم
        
        item.innerHTML = `
          <div class="pin">📍</div>
          <div class="label">
            <span>${name}</span>
            <div style="display:flex; gap:6px; align-items:center; margin-top:4px; flex-wrap:wrap;">
              <span class="distance-badge">${distanceText}</span>
              <span class="rating-badge">${ratingText}</span>

        list.appendChild(item); // Add item to list // إضافة العنصر إلى القائمة
      });
    }

    window.addToPlan = function(name) {
      // Add place to planner queue // إضافة مكان إلى قائمة المخطط
      let queue = JSON.parse(localStorage.getItem('hayyak_planner_queue') || '[]'); // Get existing queue // الحصول على القائمة الموجودة
      if (!queue.includes(name)) {
        queue.push(name); // Add name if not already present // إضافة الاسم إذا لم يكن موجودًا بالفعل
        localStorage.setItem('hayyak_planner_queue', JSON.stringify(queue)); // Save // حفظ
        showError(currentLanguage === 'ar' ? 'تمت الإضافة إلى المخطط' : 'Added to planner'); // Show success // عرض نجاح
      } else {
        showError(currentLanguage === 'ar' ? 'المكان موجود بالفعل في المخطط' : 'Place already in planner'); // Show warning // عرض تحذير
      }
      setTimeout(() => {
        window.location.href = 'PlanDay.html'; // Redirect to planner after 1 second // إعادة التوجيه إلى المخطط بعد ثانية واحدة
      }, 1000);

    function showPlace(p) {
      // Show info panel for a place // إظهار لوحة المعلومات لمكان
      const panel = document.getElementById('info-panel'); // Get info panel // الحصول على لوحة المعلومات
      
      if (panel.dataset.currentPlace === p.name && panel.classList.contains('active')) { // If same place and panel is active // إذا كان نفس المكان واللوحة نشطة
        panel.classList.remove('active'); // Hide panel // إخفاء اللوحة
        panel.dataset.currentPlace = ''; // Clear current place // مسح المكان الحالي
        return;
      }
      
      panel.dataset.currentPlace = p.name; // Store current place // تخزين المكان الحالي
      const bbox = `${p.lon-0.008},${p.lat-0.008},${p.lon+0.008},${p.lat+0.008}`; // Calculate bounding box for map // حساب المربع المحيط للخريطة
      document.querySelector('.map iframe').src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik`; // Update map // تحديث الخريطة
      
      const name = currentLanguage === 'ar' ? p.name : (p.nameEn || p.name); // Name in current language // الاسم باللغة الحالية
      const desc = currentLanguage === 'ar' ? p.desc : (p.descEn || p.desc); // Description // الوصف
      const price = currentLanguage === 'ar' ? p.price : (p.priceEn || p.price); // Price // السعر
      const time = currentLanguage === 'ar' ? p.time : (p.timeEn || p.time); // Hours // الساعات
      const distanceText = currentLanguage === 'ar' ? `${p.distance} كم` : `${p.distance} km`; // Distance // المسافة
      const ratingText = `${p.rating}/5`; // Rating // التقييم
      const rating = p.rating;
      
      // Update panel fields // تحديث حقول اللوحة
      document.getElementById('p-title').innerText = name;
      document.getElementById('p-rating').innerText = ratingText;
      document.getElementById('p-distance').innerText = distanceText;
      document.getElementById('p-time').innerText = time;
      document.getElementById('p-price').innerText = price === '0' ? (currentLanguage === 'ar' ? 'مجاني' : 'Free') : price;
      document.getElementById('p-desc').innerText = desc;
      
      const actionsDiv = document.getElementById('p-actions'); // Get actions container // الحصول على حاوية الإجراءات
      if (actionsDiv) {
        actionsDiv.innerHTML = `
          <button class="map-btn" onclick="openMap(${p.lat}, ${p.lon}, '${(name).replace(/'/g, "\\'")}', '${price}', '${time}', ${rating})">
            <span>🗺️</span>
            <span class="map-btn-text" data-ar="عرض" data-en="Map">${currentLanguage === 'ar' ? 'عرض' : 'Map'}</span>
          </button>
          <button class="plan-btn" onclick="addToPlan('${(name).replace(/'/g, "\\'")}')">
            <span>📅</span>
            <span class="plan-btn-text" data-ar="خطط" data-en="Plan">${currentLanguage === 'ar' ? 'خطط' : 'Plan'}</span>
          </button>
        `;
      }
      
      panel.classList.add('active'); // Show panel // إظهار اللوحة

      // Add to history // إضافة إلى السجل
      const item = { title: name, lat: p.lat, lon: p.lon, date: new Date().toISOString() };
      let history = JSON.parse(localStorage.getItem('hayyak_history') || '[]');
      history = history.filter(i => i.title !== name); // Remove duplicate if any // إزالة التكرار إذا وجد
      history.unshift(item); // Add to beginning // إضافة إلى البداية
      if (history.length > 20) history.pop(); // Limit to 20 items // الحد إلى 20 عنصرًا
      localStorage.setItem('hayyak_history', JSON.stringify(history)); // Save // حفظ
    }

    function selectPlace(city, placeName) {
      const place = allPlaces[city].find(p => p.name === placeName); // Find place in database // العثور على المكان في قاعدة البيانات
      if (!place) return; // Exit if not found // الخروج إذا لم يتم العثور
      
      const displayName = currentLanguage === 'ar' ? place.name : place.nameEn; // Get display name // الحصول على اسم العرض
      searchInput.value = displayName; // Set search input // تعيين حقل البحث
      autocompleteList.classList.remove('active'); // Hide autocomplete // إخفاء الإكمال التلقائي
      currentCity = city; // Update current city // تحديث المدينة الحالية
      currentSearchQuery = ''; // Clear search query // مسح استعلام البحث
      document.getElementById('city-select').value = city; // Update city select // تحديث تحديد المدينة
      filterAndSort(); // Re-filter // إعادة التصفية
      const distance = calculateDistance(userLocation.lat, userLocation.lon, place.lat, place.lon); // Calculate distance // حساب المسافة
      showPlace({...place, distance}); // Show place info // إظهار معلومات المكان
    }

    let toastTimeout; // Timer for error toast // مؤقت لإشعار الخطأ
    function showError(message) {
      const toast = document.getElementById('error-toast'); // Get toast element // الحصول على عنصر الإشعار
      if (!toast) { // If toast doesn't exist, create it // إذا لم يكن الإشعار موجودًا، قم بإنشائه
        const newToast = document.createElement('div');
        newToast.id = 'error-toast';
        newToast.className = 'error-toast';
        document.body.appendChild(newToast);
      }
      const toast2 = document.getElementById('error-toast'); // Get toast again // الحصول على الإشعار مرة أخرى
      toast2.innerText = message; // Set message // تعيين الرسالة
      toast2.classList.add('show'); // Show toast // إظهار الإشعار
      clearTimeout(toastTimeout); // Clear previous timeout // مسح المؤقت السابق
      toastTimeout = setTimeout(() => {
        toast2.classList.remove('show'); // Hide after 3.5s // إخفاء بعد 3.5 ثانية
      }, 3500);
    }

    // ---------- SEARCH (AUTOCOMPLETE + GLOBAL) ----------
    // البحث (الإكمال التلقائي + العالمي)
    const searchInput = document.getElementById('search-input'); // Get search input // الحصول على حقل البحث
    const autocompleteList = document.getElementById('autocomplete-list'); // Get autocomplete list // الحصول على قائمة الإكمال التلقائي
    
    searchInput.addEventListener('input', function (e) { // Handle input event // معالجة حدث الإدخال
      const query = this.value.trim(); // Get trimmed query // الحصول على الاستعلام بعد إزالة المسافات
      if (query.length === 0) { // If query is empty // إذا كان الاستعلام فارغًا
        currentSearchQuery = ''; // Clear search query // مسح استعلام البحث
        filterAndSort(); // Re-filter // إعادة التصفية
        autocompleteList.classList.remove('active'); // Hide autocomplete // إخفاء الإكمال التلقائي
      }
      if (query.length >= 2) { // If query length is at least 2 // إذا كان طول الاستعلام 2 على الأقل
        showAutocomplete(query); // Show autocomplete // إظهار الإكمال التلقائي
      } else {
        autocompleteList.classList.remove('active'); // Hide autocomplete // إخفاء الإكمال التلقائي
      }
    });

    searchInput.addEventListener('keypress', function (e) { // Handle keypress // معالجة الضغط على المفتاح
      if (e.key === 'Enter') { // If Enter key pressed // إذا تم الضغط على Enter
        const query = this.value.trim(); // Get trimmed query // الحصول على الاستعلام
        if (query.length >= 2) { // If query length is at least 2 // إذا كان طول الاستعلام 2 على الأقل
          performSearch(query); // Perform search // تنفيذ البحث
          autocompleteList.classList.remove('active'); // Hide autocomplete // إخفاء الإكمال التلقائي
        }
      }
    });

    function searchGlobalIndex(query) {
      // Search global index for query // البحث في الفهرس العالمي عن الاستعلام
      const q = query.toLowerCase().trim(); // Normalize query // توحيد الاستعلام
      if (!q) return []; // Return empty if no query // إعادة فارغ إذا لم يكن هناك استعلام
      return globalPlaces.filter(p => // Filter global places // تصفية الأماكن العالمية
        (p.name && p.name.toLowerCase().includes(q)) || 
        (p.nameEn && p.nameEn.toLowerCase().includes(q)) ||
        (p.desc && p.desc.toLowerCase().includes(q)) ||
        (p.descEn && p.descEn.toLowerCase().includes(q))
      );
    }

    function showAutocomplete(query) {
      const results = searchGlobalIndex(query).slice(0, 5); // Get first 5 results // الحصول على أول 5 نتائج

      if (results.length === 0) { // If no results // إذا لم تكن هناك نتائج
        autocompleteList.classList.remove('active'); // Hide autocomplete // إخفاء الإكمال التلقائي
        return;
      }

      autocompleteList.innerHTML = results.map(place => { // Generate HTML for each result // توليد HTML لكل نتيجة
        const displayName = currentLanguage === 'ar' ? place.name : place.nameEn; // Display name in current language // اسم العرض باللغة الحالية
        return `
          <div class="autocomplete-item" onclick="selectGlobalPlace('${place.page}', '${place.nameEn}', '${place.name}')">
            <div class="autocomplete-item-name">${displayName}</div>
            <div class="autocomplete-item-desc">${place.type}</div>
          </div>
        `;
      }).join('');
      
      autocompleteList.classList.add('active'); // Show autocomplete // إظهار الإكمال التلقائي
    }

    function selectGlobalPlace(page, nameEn, nameAr) {
      // Handle selection from autocomplete // معالجة الاختيار من الإكمال التلقائي
      // find the place in globalPlaces // العثور على المكان في globalPlaces
      const place = globalPlaces.find(p => p.nameEn === nameEn && p.name === nameAr);
      if (place) {
        selectPlace(place.city, place.name); // Select place // اختيار المكان
      } else {
        performSearch(nameEn || nameAr); // Fallback: perform search // احتياطي: تنفيذ البحث
      }
    }

    function performSearch(query) {
      // Perform search and update results // تنفيذ البحث وتحديث النتائج
      if (!query || query.trim().length < 2) { // If query too short // إذا كان الاستعلام قصيرًا جدًا
        currentSearchQuery = ''; // Clear search query // مسح استعلام البحث
        filterAndSort(); // Re-filter // إعادة التصفية
        return;
      }
      currentSearchQuery = query.trim().toLowerCase(); // Set search query // تعيين استعلام البحث
      filterAndSort(); // Filter and sort // التصفية والترتيب
    }

    // Initialize // التهيئة
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('translateBtn').addEventListener('click', toggleLanguage); // Attach language toggle // ربط تبديل اللغة
      
      const userProfile = JSON.parse(localStorage.getItem('hayyak_user_profile') || '{}'); // Get user profile // الحصول على ملف المستخدم
      if (userProfile.language && userProfile.language !== currentLanguage) { // If saved language differs // إذا كانت اللغة المحفوظة مختلفة
        currentLanguage = userProfile.language; // Set current language // تعيين اللغة الحالية
        document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr'; // Set direction // تعيين الاتجاه
        document.documentElement.lang = currentLanguage; // Set language // تعيين اللغة
        const btn = document.getElementById('translateBtn'); // Get button // الحصول على الزر
        if (btn) {
          const langText = btn.querySelector('span:last-child'); // Get button text // الحصول على نص الزر
          if (langText) langText.textContent = currentLanguage === 'ar' ? 'English' : 'العربية'; // Update button text // تحديث نص الزر
        }
        translateAllContent(); // Translate page // ترجمة الصفحة
      }
      
      if (userProfile.theme === 'dark') { // If dark theme enabled // إذا كانت السمة الداكنة مفعلة
        document.documentElement.setAttribute('data-theme', 'dark'); // Apply dark theme // تطبيق السمة الداكنة
      }
      
      const citySelect = document.getElementById('city-select'); // Get city select // الحصول على تحديد المدينة
      citySelect.addEventListener('change', function() { // Handle change // معالجة التغيير
        changeCity(this.value);
      });
      
      document.querySelectorAll('.sort-btn').forEach(btn => { // Attach click handlers to sort buttons // ربط معالجات النقر لأزرار الترتيب
        btn.addEventListener('click', function(e) {
          const type = this.getAttribute('data-ar').includes('الأقرب') ? 'nearest' : // Determine sort type // تحديد نوع الترتيب
                       this.getAttribute('data-ar').includes('الأعلى') ? 'rating' : 'price';
          sortPlaces(type);
        });
      });
      
      const urlParams = new URLSearchParams(window.location.search); // Get URL parameters // الحصول على معاملات URL
      const searchParam = urlParams.get('search'); // Get 'search' parameter // الحصول على معامل 'search'
      if (searchParam) {
        document.getElementById('search-input').value = searchParam; // Set search input // تعيين حقل البحث
        currentSearchQuery = searchParam.toLowerCase(); // Set search query // تعيين استعلام البحث
      }
      
      getUserLocation();
      fetchPlacesFromAPI({ category: 'Store' }).then(apiPlaces => {
        apiPlaces.forEach(p => HAYYAK_PLACES.push({ name: p.name_en||p.name_ar, nameAr: p.name_ar, city: p.city, lat: p.latitude, lon: p.longitude, rating: 0, price: p.price_range||'', time: p.opening_hours||'', category: p.category, desc: p.description_en||p.description_ar||'', phobias: p.phobia_triggers||[], medicalTriggers: p.medical_triggers||[], interestTags: p.interest_tags||[], _apiId: p.id }));
        filterAndSort();
      });
      filterAndSort(); // Initial filter and sort
    });
  </script>
  <script>
    // Location sorting helper for geolocation-based display
    // مساعد ترتيب الموقع للعرض المعتمد على الموقع الجغرافي
    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      // Calculate distance in km using Haversine formula // حساب المسافة بالكيلومتر باستخدام صيغة هافرسين
      var R = 6371; // Earth radius // نصف قطر الأرض
      var dLat = deg2rad(lat2-lat1); // Difference in latitude // فرق خط العرض
      var dLon = deg2rad(lon2-lon1); // Difference in longitude // فرق خط الطول
      var a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); // Haversine formula // صيغة هافرسين
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); // Central angle // الزاوية المركزية
      var d = R * c; // Distance // المسافة
      return d;
    }

    function deg2rad(deg) { return deg * (Math.PI/180); } // Convert degrees to radians // تحويل الدرجات إلى راديان

    function sortListByLocation(userLat, userLon) {
        // Sort the list items by distance from user location // ترتيب عناصر القائمة حسب المسافة من موقع المستخدم
        const list = document.querySelector('.list'); // Get list container // الحصول على حاوية القائمة
        if(!list) return; // Exit if not found // الخروج إذا لم توجد
        const items = Array.from(list.querySelectorAll('.item')); // Get all items // الحصول على جميع العناصر
        items.forEach(item => {
            const onclick = item.getAttribute('onclick'); // Get onclick attribute // الحصول على سمة onclick
            const match = onclick.match(/showPlace\s*\(\s*([\d\.]+)\s*,\s*([\d\.]+)/); // Extract coordinates from showPlace call // استخراج الإحداثيات من استدعاء showPlace
            if (match) item.dataset.distance = getDistanceFromLatLonInKm(userLat, userLon, parseFloat(match[1]), parseFloat(match[2])); // Calculate and store distance // حساب وتخزين المسافة
            else item.dataset.distance = 99999; // Fallback large distance // مسافة احتياطية كبيرة
        });
        items.sort((a, b) => parseFloat(a.dataset.distance) - parseFloat(b.dataset.distance)); // Sort by distance // الترتيب حسب المسافة
        items.forEach(item => list.appendChild(item)); // Re-append in sorted order // إعادة الإلحاق بالترتيب الجديد
    }

    if (navigator.geolocation) { // If geolocation is supported // إذا كان تحديد الموقع مدعومًا
        navigator.geolocation.getCurrentPosition(p => sortListByLocation(p.coords.latitude, p.coords.longitude)); // Get user location and sort // الحصول على موقع المستخدم والترتيب
    }
  </script>
